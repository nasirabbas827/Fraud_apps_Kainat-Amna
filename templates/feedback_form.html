{% extends "base.html" %}
{% load static %}

{% block title %}Submit Feedback{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow border-0 rounded-4 p-4">
                <h4 class="fw-bold mb-3 text-primary text-center">Submit System Feedback</h4>
                {% if username %}
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary w-100 rounded-pill mt-3">
                            Submit Feedback
                        </button>
                    </form>
                {% else %}
                    <p class="text-muted text-center">Login to submit feedback.</p>
                    <a href="{% url 'login' %}" class="btn btn-outline-primary w-100 rounded-pill mt-3">
                        Login
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
